# Finanza — Nginx Configuration
# V19: Version-controlled nginx config with proper security headers
# Deploy to: /etc/nginx/sites-available/finanzaai.tech

upstream finanza_api {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name finanzaai.tech www.finanzaai.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name finanzaai.tech www.finanzaai.tech;

    # SSL
    ssl_certificate /etc/letsencrypt/live/finanzaai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finanzaai.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (must be in EACH location block due to nginx inheritance)
    # See: /etc/nginx/snippets/security-headers.conf

    # API proxy
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://finanza_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Frontend static files
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        root /var/www/finanzaai.tech/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            include /etc/nginx/snippets/security-headers.conf;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Downloads (APK files)
    location /downloads/ {
        include /etc/nginx/snippets/security-headers.conf;
        alias /var/www/finanzaai.tech/downloads/;
        autoindex off;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }
}
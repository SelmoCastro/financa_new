name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '✨ Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '⚡ Performance'
    labels:
      - 'performance'
  - title: '♻️ Refactoring'
    labels:
      - 'refactor'
  - title: '📝 Documentation'
    labels:
      - 'docs'
      - 'documentation'
  - title: '🔧 CI/CD'
    labels:
      - 'ci'
      - 'build'
  - title: '🧹 Chores'
    labels:
      - 'chore'
  - title: '📦 Dependencies'
    labels:
      - 'dependencies'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## Downloads
  - 📱 **Android APK**: Disponível em [Releases](https://github.com/SelmoCastro/financa_new/releases)
  - 🌐 **Web**: https://finanzaai.tech

  ## Changes

  $CHANGES
name: Inspect Legacy Recurring Data

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}
  VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '8443' }}
  VPS_BACKEND_PATH: ${{ secrets.VPS_BACKEND_PATH || '/opt/finanza/backend' }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Inspect production data
        run: |
          ssh -p "$VPS_SSH_PORT" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$VPS_BACKEND_PATH"
          node <<'NODE'
          require('dotenv').config({ path: '.env' });
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient();
          (async () => {
            const db = await p.$queryRawUnsafe('SELECT current_database() AS db, current_schema() AS schema, inet_server_addr()::text AS host, inet_server_port() AS port');
            const fixed = await p.transaction.groupBy({ by: ['userId'], where: { isFixed: true, type: { in: ['INCOME', 'EXPENSE'] }, deletedAt: null }, _count: { _all: true } });
            const recurring = await p.recurringTransaction.groupBy({ by: ['userId'], _count: { _all: true } });
            const fixedTotal = await p.transaction.count({ where: { isFixed: true, type: { in: ['INCOME', 'EXPENSE'] }, deletedAt: null } });
            const recurringTotal = await p.recurringTransaction.count();
            const legacyIds = await p.transaction.findMany({ where: { isFixed: true, type: { in: ['INCOME', 'EXPENSE'] }, deletedAt: null }, select: { id: true, userId: true, description: true, type: true, categoryId: true, accountId: true, creditCardId: true, invoiceId: true, installmentId: true, date: true }, orderBy: [{ userId: 'asc' }, { date: 'asc' }] });
            console.log(JSON.stringify({ database: db[0], fixedTotal, recurringTotal, fixedByUser: fixed, recurringByUser: recurring, legacyTransactions: legacyIds.map(x => ({...x, descriptionLength: x.description.length, descriptionHash: require('crypto').createHash('sha256').update(x.description).digest('hex').slice(0,16), description: undefined })) }, null, 2));
          })().catch(e => { console.error(e); process.exitCode = 1; }).finally(() => p.$disconnect());
          NODE
          REMOTE

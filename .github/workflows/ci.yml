# CI — runs on every PR and push to master
# Fast feedback: lint + typecheck (~2min)

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: finanza_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d finanza_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            mobile/package-lock.json

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Backend type check
        run: cd backend && npx tsc --noEmit

      - name: Backend tests
        run: cd backend && npm test -- --runInBand

      - name: Prepare integration database
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5433/finanza_test
        run: cd backend && npx prisma db push --skip-generate

      - name: Backend integration tests
        env:
          DATABASE_URL_TEST: postgresql://test_user:test_password@localhost:5433/finanza_test
        run: cd backend && npx jest --config jest.integration.config.js --runInBand

      - name: Backend production dependency audit
        run: cd backend && npm audit --omit=dev --audit-level=high

      - name: Backend lint
        run: cd backend && npx eslint src/ --max-warnings 0

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Frontend type check
        run: cd frontend && npx tsc --noEmit

      - name: Frontend build
        run: cd frontend && npm run build
        # Build succeeds = no broken imports

      - name: Install mobile deps
        run: cd mobile && npm ci

      - name: Mobile type check
        run: cd mobile && npx tsc --noEmit

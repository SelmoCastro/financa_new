name: Cleanup Legacy Recurring Data

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}
  VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '8443' }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Backup and clean legacy recurring rows
        run: |
          ssh -p "$VPS_SSH_PORT" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/opt/finanza/backend
          test -f "$APP/.env"
          test "$(stat -c '%a' "$APP/.env")" = 600
          DB_URL=$(awk -F= '$1 == "DATABASE_URL" {sub(/^[^=]*=/, ""); print; exit}' "$APP/.env")
          DB_URL="${DB_URL#\"}"; DB_URL="${DB_URL%\"}"
          DB_URL="${DB_URL#\'}"; DB_URL="${DB_URL%\'}"
          test -n "$DB_URL"
          BACKUP_DIR=/opt/backups
          mkdir -p "$BACKUP_DIR"
          TS=$(date +%Y%m%d_%H%M%S)
          BACKUP="$BACKUP_DIR/finanza_legacy-recurring-pre-cleanup_${TS}.sql.gz"
          pg_dump "$DB_URL" | gzip > "$BACKUP"
          test -s "$BACKUP"
          sha256sum "$BACKUP" > "$BACKUP.sha256"
          echo "BACKUP_CREATED=$(basename "$BACKUP")"
          echo "BACKUP_SHA256=$(cut -d' ' -f1 "$BACKUP.sha256")"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL lock_timeout = '10s';
          SET LOCAL statement_timeout = '60s';
          DO $$
          DECLARE
            recurring_count integer;
            fixed_count integer;
          BEGIN
            SELECT count(*) INTO recurring_count FROM "RecurringTransaction"
              WHERE id IN ('c34ba1ce-a02e-45e3-bdc4-3a57c8a79231','2adb6650-90bc-4b0f-94ac-45b470424305','d8613b56-32d0-437c-8db3-4c6da21f1871');
            SELECT count(*) INTO fixed_count FROM "Transaction"
              WHERE id IN ('2d2f6091-5421-46e7-8c3f-f4501c961ffd','004f3d77-3281-4047-8f00-0f838d9990e4','0a4b0afb-31e9-4bfa-8119-d9e625eb84d4') AND "isFixed" = true;
            IF recurring_count <> 3 OR fixed_count <> 3 THEN
              RAISE EXCEPTION 'Precondition failed: recurring=%, fixed=%', recurring_count, fixed_count;
            END IF;
          END $$;
          UPDATE "Transaction"
             SET "isFixed" = false, "updatedAt" = NOW(), "version" = "version" + 1
           WHERE id IN ('2d2f6091-5421-46e7-8c3f-f4501c961ffd','004f3d77-3281-4047-8f00-0f838d9990e4','0a4b0afb-31e9-4bfa-8119-d9e625eb84d4')
             AND "isFixed" = true;
          DELETE FROM "RecurringTransaction"
           WHERE id IN ('c34ba1ce-a02e-45e3-bdc4-3a57c8a79231','2adb6650-90bc-4b0f-94ac-45b470424305','d8613b56-32d0-437c-8db3-4c6da21f1871');
          DO $$
          DECLARE
            remaining_recurring integer;
            remaining_fixed integer;
          BEGIN
            SELECT count(*) INTO remaining_recurring FROM "RecurringTransaction"
              WHERE id IN ('c34ba1ce-a02e-45e3-bdc4-3a57c8a79231','2adb6650-90bc-4b0f-94ac-45b470424305','d8613b56-32d0-437c-8db3-4c6da21f1871');
            SELECT count(*) INTO remaining_fixed FROM "Transaction"
              WHERE id IN ('2d2f6091-5421-46e7-8c3f-f4501c961ffd','004f3d77-3281-4047-8f00-0f838d9990e4','0a4b0afb-31e9-4bfa-8119-d9e625eb84d4') AND "isFixed" = true;
            IF remaining_recurring <> 0 OR remaining_fixed <> 0 THEN
              RAISE EXCEPTION 'Postcondition failed: recurring=%, fixed=%', remaining_recurring, remaining_fixed;
            END IF;
          END $$;
          COMMIT;
          SQL
          echo 'SQL_CLEANUP_COMMITTED=true'
          psql "$DB_URL" -Atc 'SELECT ''recurring_total='' || count(*) FROM "RecurringTransaction"; SELECT ''fixed_total='' || count(*) FROM "Transaction" WHERE "isFixed" = true AND type IN (''INCOME'',''EXPENSE'') AND "deletedAt" IS NULL;'
          REMOTE

name: Mobile SSL Pin Watch

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-pins:
    name: Verify live mobile TLS pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify configured pins match the live API chain
        run: python3 scripts/verify-mobile-ssl-pins.py --source mobile/services/sslPinning.ts --host api.finanzaai.tech

name: Browser E2E Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL do ambiente de QA'
        required: true
        default: 'https://finanzaai.tech'
        type: string

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Full menu and transaction smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required QA secrets
        run: |
          test -n "$E2E_EMAIL" || (echo 'Missing repository secret: E2E_EMAIL' >&2; exit 1)
          test -n "$E2E_PASSWORD" || (echo 'Missing repository secret: E2E_PASSWORD' >&2; exit 1)

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            qa/playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

# Release — runs when a version tag (v1.2.3) is pushed
# Builds backend, deploys to VPS, builds APK, creates GitHub Release

name: Release

on:
  push:
    tags:
      - 'v*.*.*'                      # v1.7.13 (stable)
      - 'v*.*.*-*'                    # v1.7.14-beta.1 (prerelease)
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to deploy
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}
  VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '8443' }}
  VPS_BACKEND_PATH: ${{ secrets.VPS_BACKEND_PATH || '/opt/finanza/backend' }}
  VERSION: ${{ inputs.release_tag || github.ref_name }}

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Deploy Backend to VPS
  # ──────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    needs: build-apk
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.VPS_SSH_PORT }} -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Prepare backend artifact
        run: |
          tar --exclude='backend/node_modules' \
              --exclude='backend/dist' \
              --exclude='backend/.env*' \
              -czf "finanza-backend-${{ env.VERSION }}.tar.gz" backend package.json

      - name: Upload backend artifact
        run: |
          scp -P ${{ env.VPS_SSH_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -O \
            "finanza-backend-${{ env.VERSION }}.tar.gz" \
            "${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/tmp/"

      - name: Deploy backend artifact
        run: |
          SSH="ssh -p ${{ env.VPS_SSH_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          $SSH 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="${{ env.VPS_BACKEND_PATH }}"
          ROOT_APP="$(dirname "$APP")"
          VERSION="${{ env.VERSION }}"
          ARCHIVE="/tmp/finanza-backend-${VERSION}.tar.gz"
          BACKUP_DIR="/opt/backups"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          test -d "$APP"
          test -f "$APP/.env"
          test "$(stat -c '%a' "$APP/.env")" = 600
          grep -q '^ENCRYPTION_KEY=' "$APP/.env"
          mkdir -p "$BACKUP_DIR"

          DB_URL=$(awk -F= '$1 == "DATABASE_URL" {sub(/^[^=]*=/, ""); print; exit}' "$APP/.env")
          DB_URL="${DB_URL#\"}"
          DB_URL="${DB_URL%\"}"
          DB_URL="${DB_URL#\'}"
          DB_URL="${DB_URL%\'}"
          test -n "$DB_URL"
          pg_dump "$DB_URL" | gzip > "$BACKUP_DIR/finanza_${VERSION}_${TIMESTAMP}.sql.gz"
          test -s "$BACKUP_DIR/finanza_${VERSION}_${TIMESTAMP}.sql.gz"

          CURRENT_BACKUP="/opt/backups/finanza-backend-pre-${VERSION}.tar.gz"
          rm -f "$CURRENT_BACKUP"
          tar --exclude='node_modules' --exclude='dist' --exclude='.env*' -czf "$CURRENT_BACKUP" -C "$(dirname "$APP")" "$(basename "$APP")"
          ROOT_BACKUP="/opt/backups/finanza-root-pre-${VERSION}.tar.gz"
          tar -czf "$ROOT_BACKUP" -C "$ROOT_APP" package.json version-meta.json

          STAGE="$(mktemp -d /opt/finanza-release.XXXXXX)"
          trap 'rm -rf "$STAGE" "$ARCHIVE"' EXIT
          tar -xzf "$ARCHIVE" -C "$STAGE"
          RELEASE="$STAGE/backend"
          cd "$RELEASE"
          cp "$APP/.env" "$RELEASE/.env"
          chmod 600 "$RELEASE/.env"
          npm ci
          npx prisma migrate deploy
          npm run build

          rsync -a --delete --exclude='.env' "$RELEASE/" "$APP/"
          install -m 644 "$STAGE/package.json" "$ROOT_APP/package.json"
          install -m 644 "$RELEASE/src/version-meta.json" "$ROOT_APP/version-meta.json"
          test -f "$APP/dist/main.js"
          echo "Artifact ${VERSION} staged successfully"
          REMOTE

      - name: Health Check with rollback
        run: |
          set -euo pipefail
          SSH="ssh -p ${{ env.VPS_SSH_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }}"
          $SSH "pm2 delete finanza-api 2>/dev/null || true; cd '${{ env.VPS_BACKEND_PATH }}' && pm2 start dist/main.js --name finanza-api --cwd '${{ env.VPS_BACKEND_PATH }}' && pm2 save" || true
          sleep 5
          HTTP_CODE=$($SSH "curl -s -H 'Origin: https://finanzaai.tech' -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/v1/app/version")
          VERSION_RESPONSE=$($SSH "curl -s -H 'Origin: https://finanzaai.tech' http://127.0.0.1:3000/v1/app/version | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"data\"][\"version\"])'") || true
          if [[ "$HTTP_CODE" != "200" || "$VERSION_RESPONSE" != "${VERSION#v}" ]]; then
            echo "Health check failed (HTTP $HTTP_CODE, version $VERSION_RESPONSE); restoring previous backend"
            $SSH "set -euo pipefail; APP='${{ env.VPS_BACKEND_PATH }}'; ROOT_APP=\$(dirname \"\$APP\"); BACKUP='/opt/backups/finanza-backend-pre-${{ env.VERSION }}.tar.gz'; ROOT_BACKUP='/opt/backups/finanza-root-pre-${{ env.VERSION }}.tar.gz'; STAGE=\$(mktemp -d /opt/finanza-rollback.XXXXXX); ROOT_STAGE=\$(mktemp -d /opt/finanza-root-rollback.XXXXXX); trap 'rm -rf \"\$STAGE\" \"\$ROOT_STAGE\"' EXIT; tar -xzf \"\$BACKUP\" -C \"\$STAGE\"; tar -xzf \"\$ROOT_BACKUP\" -C \"\$ROOT_STAGE\"; rsync -a --delete --exclude='.env' \"\$STAGE/backend/\" \"\$APP/\"; install -m 644 \"\$ROOT_STAGE/package.json\" \"\$ROOT_APP/package.json\"; install -m 644 \"\$ROOT_STAGE/version-meta.json\" \"\$ROOT_APP/version-meta.json\"; pm2 delete finanza-api 2>/dev/null || true; cd \"\$APP\"; pm2 start dist/main.js --name finanza-api --cwd \"\$APP\"; pm2 save"
            exit 1
          fi
          echo "Backend deployed: $VERSION_RESPONSE"


  # ──────────────────────────────────────────────
  # Job 2: Build Android APK
  # ──────────────────────────────────────────────
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          # Manual reruns use this workflow commit; tag pushes remain immutable.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify mobile release version sources
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${VERSION#v}"
          EXPECTED_VERSION="$EXPECTED_VERSION" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = os.environ['EXPECTED_VERSION']
          app = json.loads(Path('mobile/app.json').read_text(encoding='utf-8'))['expo']
          gradle = Path('mobile/android/app/build.gradle').read_text(encoding='utf-8')
          version_name = re.search(r'versionName\s+"([^"]+)"', gradle)
          version_code = re.search(r'versionCode\s+(\d+)', gradle)
          assert app['version'] == expected, (app['version'], expected)
          assert version_name and version_name.group(1) == expected
          assert version_code and int(version_code.group(1)) == int(app['android']['versionCode'])
          print(f"Version sources OK: {expected} (code {app['android']['versionCode']})")
          PY

      - name: Verify live mobile TLS pins
        run: python3 scripts/verify-mobile-ssl-pins.py --source mobile/services/sslPinning.ts --host api.finanzaai.tech

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        run: cd mobile && npm ci

      - name: Patch gradle for CI
        run: |
          set -euo pipefail
          cd mobile/android
          # Reduce memory for CI (4GB runners); keep this safe when the file is absent.
          touch gradle.properties
          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i 's#^org.gradle.jvmargs=.*#org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m#' gradle.properties
          else
            printf '%s\n' 'org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m' >> gradle.properties
          fi
          if grep -q '^org.gradle.parallel=' gradle.properties; then
            sed -i 's#^org.gradle.parallel=.*#org.gradle.parallel=false#' gradle.properties
          else
            printf '%s\n' 'org.gradle.parallel=false' >> gradle.properties
          fi

      - name: Configure production signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/finanza-release.keystore"
          chmod 600 "$RUNNER_TEMP/finanza-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/finanza-release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/finanza-release.keystore" >> "$GITHUB_ENV"

      - name: Build APK (release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd mobile/android
          ./gradlew assembleRelease --no-daemon -x lintVitalAnalyzeRelease -x lint

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "❌ APK not found!"
            exit 1
          fi
          VER_NUM="${VERSION#v}"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionName='${VER_NUM}'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/apksigner.txt"; then
            echo "❌ Release APK is signed with the debug certificate"
            exit 1
          fi
          SIZE=$(du -h "$APK" | cut -f1)
          echo "✅ APK built and production-signed ($SIZE)"

      - name: Rename APK
        run: |
          VERSION="${{ env.VERSION }}"
          # Strip 'v' prefix
          VER_NUM="${VERSION#v}"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
             "Financa_new_v${VER_NUM}.apk"
          echo "APK_NAME=Financa_new_v${VER_NUM}.apk" >> $GITHUB_ENV

      - name: Upload APK to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.VPS_SSH_PORT }} -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

          VERSION="${{ env.VERSION }}"
          VER_NUM="${VERSION#v}"
          APK_DEST="/var/www/finanzaai.tech/downloads/Financa_new_v${VER_NUM}.apk"

          echo "📤 Uploading APK..."
          scp -P ${{ env.VPS_SSH_PORT }} -i ~/.ssh/deploy_key \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -O \
            "${{ env.APK_NAME }}" \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/tmp/finanza-${VER_NUM}.apk

          echo "🔗 Creating symlink..."
          ssh -p ${{ env.VPS_SSH_PORT }} -i ~/.ssh/deploy_key ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << EOF
            cp /tmp/finanza-${VER_NUM}.apk ${APK_DEST}
            ln -sf ${APK_DEST} /var/www/finanzaai.tech/downloads/Financa_new.apk
            rm /tmp/finanza-${VER_NUM}.apk
            echo "✅ APK deployed: ${APK_DEST}"
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Finanza ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          body: |
            ## Downloads
            - 📱 **Android APK**: [${{ env.APK_NAME }}](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.APK_NAME }})

            ## Update URL
            Apk also available at: https://finanzaai.tech/downloads/${{ env.APK_NAME }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 3: Post-deploy verification
  # ──────────────────────────────────────────────
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend, build-apk]
    steps:
      - name: Verify API and mobile artifact contract
        run: |
          set -euo pipefail
          VER_NUM="${VERSION#v}"
          VERSION_JSON="$(curl -fsS --retry 5 --retry-delay 2 https://api.finanzaai.tech/v1/app/version)"
          VERSION_JSON="$VERSION_JSON" EXPECTED_VERSION="$VER_NUM" python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ['VERSION_JSON'])['data']
          expected = os.environ['EXPECTED_VERSION']
          expected_url = f'https://finanzaai.tech/downloads/Financa_new_v{expected}.apk'
          assert data['version'] == expected, data['version']
          assert data['mobileVersion'] == expected, data['mobileVersion']
          assert data['apkAvailable'] is True, data['apkAvailable']
          assert data['apkUrl'] == expected_url, data['apkUrl']
          print(f'API/mobile artifact contract OK: v{expected}')
          PY

      - name: Check APK download URL
        run: |
          VERSION="${{ env.VERSION }}"
          VER_NUM="${VERSION#v}"
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' "https://finanzaai.tech/downloads/Financa_new_v${VER_NUM}.apk")
          if [[ "$HTTP" != "200" ]]; then
            echo "❌ APK URL returned HTTP $HTTP"
            exit 1
          fi
          echo "✅ APK download URL is live"

      - name: Summary
        run: |
          VERSION="${{ env.VERSION }}"
          VER_NUM="${VERSION#v}"
          echo "🎉 Release ${{ env.VERSION }} deployed successfully!"
          echo ""
          echo "   Backend: https://finanzaai.tech/api/v1"
          echo "   APK:     https://finanzaai.tech/downloads/Financa_new_v${VER_NUM}.apk"
          echo "   GitHub:  ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.VERSION }}"
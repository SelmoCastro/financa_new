# Version bump — creates a PR; it never writes directly to master.
# Merge of the release PR creates the tag in tag-after-merge.yml.
name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      release_notes:
        description: Release notes (optional)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: 22

jobs:
  bump:
    name: Prepare version bump PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Calculate next version
        id: next
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump_type }}" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "Unsupported bump type" >&2; exit 1 ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEW"

      - name: Update all version sources
        env:
          NEW_VERSION: ${{ steps.next.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.NEW_VERSION;
          const notes = (process.env.RELEASE_NOTES || '').trim() || 'Atualização de versão.';

          for (const file of [
            'package.json',
            'backend/package.json',
            'frontend/package.json',
            'mobile/package.json',
          ]) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = version;
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }

          const appFile = 'mobile/app.json';
          const app = JSON.parse(fs.readFileSync(appFile, 'utf8'));
          app.expo.version = version;
          app.expo.android.versionCode = Number(app.expo.android.versionCode) + 1;
          app.version = version;
          app.versionCode = app.expo.android.versionCode;
          fs.writeFileSync(appFile, JSON.stringify(app, null, 2) + '\n');

          const gradleFile = 'mobile/android/app/build.gradle';
          let gradle = fs.readFileSync(gradleFile, 'utf8');
          const versionCode = app.expo.android.versionCode;
          gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${versionCode}`);
          gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "${version}"`);
          fs.writeFileSync(gradleFile, gradle);

          const metaFile = 'backend/src/version-meta.json';
          const meta = JSON.parse(fs.readFileSync(metaFile, 'utf8'));
          meta.version = version;
          meta.mobileVersion = version;
          meta.releaseNotes = notes;
          fs.writeFileSync(metaFile, JSON.stringify(meta, null, 2) + '\n');

          const changelogFile = 'CHANGELOG.md';
          const existing = fs.existsSync(changelogFile)
            ? fs.readFileSync(changelogFile, 'utf8')
            : '# Changelog\n\n';
          const date = new Date().toISOString().slice(0, 10);
          const entry = `## [${version}] (${date})\n\n${notes}\n\n`;
          const header = existing.startsWith('# Changelog') ? '# Changelog\n\n' : '# Changelog\n\n';
          const body = existing.replace(/^# Changelog\s*/i, '');
          fs.writeFileSync(changelogFile, header + entry + body);
          NODE

      - name: Verify version consistency
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('package.json')).version;
          const files = ['backend/package.json', 'frontend/package.json', 'mobile/package.json'];
          for (const file of files) {
            if (JSON.parse(fs.readFileSync(file)).version !== version) throw new Error(`${file} diverged`);
          }
          const app = JSON.parse(fs.readFileSync('mobile/app.json'));
          if (app.expo.version !== version || app.version !== version) throw new Error('app.json version diverged');
          if (!new RegExp(`versionName "${version.replaceAll('.', '\\.') }"`).test(fs.readFileSync('mobile/android/app/build.gradle', 'utf8'))) throw new Error('Gradle versionName diverged');
          console.log(`Version ${version} is consistent`);
          NODE

      - name: Create release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package.json backend/package.json frontend/package.json mobile/package.json \
            mobile/app.json mobile/android/app/build.gradle \
            backend/src/version-meta.json CHANGELOG.md
          git commit -m "chore: prepare release v${VERSION}"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "chore: prepare release v${VERSION}" \
            --body $'## Release preparation\n- Synchronizes all package versions.\n- Synchronizes Expo version, Android versionCode, and Gradle versionName.\n- Updates backend version metadata and CHANGELOG.\n\nCI must pass before merge.'

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baixar Finanza AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px}
.card{background:#1e293b;border-radius:2rem;padding:3rem 2.5rem;max-width:420px;width:100%;text-align:center;border:1px solid #334155;box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}
.logo{width:80px;height:80px;background:linear-gradient(135deg,#4f46e5,#6366f1);border-radius:2rem;margin:0 auto 2rem;display:flex;align-items:center;justify-content:center;box-shadow:0 15px 30px -10px rgba(99,102,241,.4)}
.logo svg{width:40px;height:40px;fill:white}
h1{color:#f8fafc;font-size:1.75rem;font-weight:900;letter-spacing:-.025em;margin-bottom:.5rem}
.tag{color:#818cf8;font-size:.65rem;font-weight:900;letter-spacing:.3em;text-transform:uppercase;margin-bottom:.5rem}
.sub{color:#94a3b8;font-size:.875rem;margin-bottom:2rem;line-height:1.6}
.badge{display:inline-flex;align-items:center;gap:.5rem;background:#1e1b4b;color:#a5b4fc;padding:.5rem 1rem;border-radius:1rem;font-size:.7rem;font-weight:700;margin-bottom:1.5rem}
.btn{display:block;width:100%;padding:1rem;background:linear-gradient(135deg,#4f46e5,#6366f1);color:white;text-decoration:none;border-radius:1rem;font-weight:900;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;transition:all .2s;box-shadow:0 10px 25px -5px rgba(99,102,241,.4)}
.btn:active{transform:scale(.95)}
.btn.disabled{opacity:0.5;pointer-events:none;filter:grayscale(1)}
.foot{color:#475569;font-size:.65rem;margin-top:1.5rem;line-height:1.5}
.foot a{color:#818cf8;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div class="logo"><svg viewBox="0 0 24 24"><path d="M17.523 15.341a.997.997 0 0 0 0-1.994.997.997 0 0 0 0 1.994m-11.046 0a.997.997 0 0 0 0-1.994.997.997 0 0 0 0 1.994m11.405-6.02l1.996-3.46a.416.416 0 0 0-.152-.567.416.416 0 0 0-.567.152l-2.02 3.5C15.56 8.341 13.854 7.99 12 7.99s-3.56.351-5.14.976L4.84 5.466a.416.416 0 0 0-.567-.152.416.416 0 0 0-.152.567l1.997 3.46C3.024 11.462 1.2 14.097 1.2 17.1h21.6c0-3.003-1.824-5.638-4.918-7.779"/></svg></div>
<p class="tag">Finanza AI</p>
<h1>Instalar no Android</h1>
<p class="sub">Toque no botão abaixo para baixar o instalador APK oficial.</p>
<div class="badge" id="version-badge">Verificando...</div>
<a class="btn disabled" id="download-btn" href="#">Aguarde...</a>
<p class="foot">Ao baixar, abra o arquivo e permita a instalação de fontes desconhecidas.<br>Disponível apenas para Android. <a href="https://finanzaai.tech">Versão Web</a></p>
</div>
<script>
const badge = document.getElementById('version-badge');
const btn = document.getElementById('download-btn');

// Fetch latest version info from API
fetch('https://api.finanzaai.tech/v1/app/version')
  .then(r => r.json())
  .then(res => {
    const data = res.data || res;
    if (data.version) {
      badge.textContent = 'Versão v' + data.version + ' • APK Oficial';
      btn.href = data.apkUrl || 'https://finanzaai.tech/downloads/Financa_new.apk';
      btn.textContent = 'Baixar APK v' + data.version;
      btn.classList.remove('disabled');
    }
  })
  .catch(() => {
    badge.textContent = 'Download APK Direto';
    btn.href = 'https://finanzaai.tech/downloads/Financa_new.apk';
    btn.textContent = 'Baixar APK';
    btn.classList.remove('disabled');
  });
</script>
</body>
</html>
